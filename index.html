<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEONWAVE — Player</title>
<style>
  :root{
    --bg:#07070f;
    --panel:rgba(20,20,40,.55);
    --border:rgba(255,255,255,.08);
    --accent:#7c5cff;
    --accent2:#00e5ff;
    --accent3:#ff4ecd;
    --text:#eef0ff;
    --muted:#8a8db3;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI","Hiragino Sans",system-ui,sans-serif;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(124,92,255,.25), transparent 60%),
      radial-gradient(1000px 600px at 110% 20%, rgba(0,229,255,.16), transparent 55%),
      radial-gradient(900px 700px at 50% 120%, rgba(255,78,205,.18), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:28px 18px;
    overflow-x:hidden;
  }
  .app{
    width:100%;max-width:880px;
    background:var(--panel);
    backdrop-filter:blur(22px);
    border:1px solid var(--border);
    border-radius:26px;
    padding:26px 28px 22px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    position:relative;overflow:hidden;
  }
  .app::before{ /* moving sheen */
    content:"";position:absolute;inset:-40%;
    background:conic-gradient(from 0deg, transparent 0 70%, rgba(124,92,255,.12) 80%, rgba(0,229,255,.10) 88%, transparent 100%);
    animation:spin 14s linear infinite;pointer-events:none;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;position:relative;z-index:1}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.18em;font-size:.85rem;color:var(--muted)}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 0 12px var(--accent2)}
  .badge{font-size:.7rem;letter-spacing:.2em;color:var(--accent2);border:1px solid rgba(0,229,255,.35);border-radius:999px;padding:5px 12px;text-transform:uppercase}

  .stage{display:flex;gap:26px;position:relative;z-index:1}
  .left{flex:1.15;min-width:0}
  .right{flex:1;min-width:0;display:flex;flex-direction:column}

  /* --- disc / art --- */
  .artwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px}
  .disc{
    width:190px;height:190px;border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), transparent 30%),
      conic-gradient(from 0deg,#1b1440,#3b2a8f,#0e3b52,#6b1f6e,#1b1440);
    box-shadow:0 0 0 6px rgba(255,255,255,.04), 0 20px 50px rgba(0,0,0,.6), 0 0 60px rgba(124,92,255,.35);
    position:relative;
    animation:spin 9s linear infinite;
    animation-play-state:paused;
  }
  .disc.playing{animation-play-state:running}
  .disc::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#07070f;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
  .disc::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(255,255,255,.15)}

  .viz{width:100%;height:74px;border-radius:12px;display:block}

  .meta{text-align:center;margin-top:4px}
  .title{font-size:1.35rem;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .artist{color:var(--muted);font-size:.85rem;margin-top:4px;letter-spacing:.12em;text-transform:uppercase}
  .eq{display:inline-flex;gap:3px;align-items:flex-end;height:14px;margin-right:8px;vertical-align:middle}
  .eq i{width:3px;background:linear-gradient(180deg,var(--accent2),var(--accent3));border-radius:2px;animation:eq 1s ease-in-out infinite;animation-play-state:paused}
  .eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.6s}
  .playing .eq i{animation-play-state:running}
  @keyframes eq{0%,100%{height:4px}50%{height:14px}}

  /* --- progress --- */
  .progress{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-variant-numeric:tabular-nums;font-size:.75rem;color:var(--muted)}
  .bar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.08);cursor:pointer;position:relative}
  .bar .fill{position:absolute;inset:0 auto 0 0;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent),var(--accent3));box-shadow:0 0 12px rgba(124,92,255,.8)}
  .bar .knob{position:absolute;top:50%;left:0%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(255,255,255,.7);opacity:0;transition:opacity .2s}
  .bar:hover .knob{opacity:1}

  /* --- controls --- */
  .controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
  .btn{
    background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);
    width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1rem;
    display:flex;align-items:center;justify-content:center;transition:.2s;
  }
  .btn:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
  .btn:active{transform:scale(.94)}
  .btn.main{
    width:62px;height:62px;font-size:1.35rem;border:none;
    background:linear-gradient(135deg,var(--accent2),var(--accent) 55%,var(--accent3));
    color:#0b0b18;box-shadow:0 8px 30px rgba(124,92,255,.55);
  }
  .btn.main:hover{filter:brightness(1.12)}
  .btn.toggled{color:var(--accent2);border-color:rgba(0,229,255,.5);box-shadow:0 0 12px rgba(0,229,255,.25)}
  .vol{display:flex;align-items:center;gap:8px;margin-left:6px}
  .vol input{width:90px;accent-color:var(--accent)}

  /* --- playlist --- */
  .listhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .listhead h2{font-size:.8rem;letter-spacing:.2em;color:var(--muted);font-weight:700}
  .add{
    font-size:.75rem;cursor:pointer;color:var(--accent2);background:rgba(0,229,255,.08);
    border:1px solid rgba(0,229,255,.3);border-radius:10px;padding:7px 12px;transition:.2s;
  }
  .add:hover{background:rgba(0,229,255,.18)}
  .plist{flex:1;min-height:180px;max-height:320px;overflow:auto;border:1px dashed var(--border);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
  .plist.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;text-align:center;border-style:dashed}
  .track{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;
    background:rgba(255,255,255,.03);border:1px solid transparent;transition:.15s;font-size:.85rem;
  }
  .track:hover{background:rgba(255,255,255,.08)}
  .track.active{background:linear-gradient(90deg,rgba(124,92,255,.22),rgba(0,229,255,.08));border-color:rgba(124,92,255,.5)}
  .track .n{width:20px;color:var(--muted);font-size:.75rem;text-align:center}
  .track .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .dur{color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
  .track .x{opacity:0;color:var(--muted);font-size:.8rem;padding:2px 4px}
  .track:hover .x{opacity:1}
  .track .x:hover{color:#ff6b9d}

  .dropzone{
    margin-top:12px;border:1px dashed rgba(124,92,255,.4);border-radius:14px;padding:14px;
    text-align:center;color:var(--muted);font-size:.78rem;transition:.2s;position:relative;z-index:1;
  }
  .dropzone.over{background:rgba(124,92,255,.14);color:var(--text);border-color:var(--accent)}

  footer{margin-top:16px;text-align:center;color:var(--muted);font-size:.72rem;letter-spacing:.08em;position:relative;z-index:1}

  @media (max-width:720px){
    .stage{flex-direction:column}
    .plist{max-height:200px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span>NEONWAVE PLAYER</div>
    <div class="badge">Web Audio</div>
  </header>

  <div class="stage">
    <section class="left">
      <div class="artwrap">
        <div class="disc" id="disc"></div>
        <canvas class="viz" id="viz"></canvas>
        <div class="meta">
          <div class="title" id="title">何も読み込まれていません</div>
          <div class="artist"><span class="eq" id="eq"><i></i><i></i><i></i><i></i></span><span id="artist">ローカルファイルまたはデモ曲をどうぞ</span></div>
        </div>
      </div>

      <div class="progress">
        <span id="cur">0:00</span>
        <div class="bar" id="bar"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
        <span id="dur">0:00</span>
      </div>

      <div class="controls">
        <button class="btn" id="shuffle" title="シャッフル">🔀</button>
        <button class="btn" id="prev" title="前の曲">⏮</button>
        <button class="btn main" id="play" title="再生/一時停止">▶</button>
        <button class="btn" id="next" title="次の曲">⏭</button>
        <button class="btn" id="repeat" title="リピート">🔁</button>
        <div class="vol">🔊 <input type="range" id="volume" min="0" max="100" value="80"></div>
      </div>
    </section>

    <section class="right">
      <div class="listhead">
        <h2>PLAYLIST</h2>
        <button class="add" id="addBtn">＋ 曲を追加</button>
      </div>
      <div class="plist" id="plist"></div>
      <div class="dropzone" id="drop">🎧 ここにオーディオファイルをドロップ (mp3 / wav / ogg …)</div>
      <input type="file" id="fileInput" accept="audio/*" multiple hidden>
    </section>
  </div>

  <footer>SPACE: 再生/停止 ←→: 曲移動 &nbsp;·&nbsp; すべての処理はブラウザ内で完結します</footer>
</div>

<script>
/* ============ state ============ */
const tracks = [];            // {name, artist, url|buffer, duration, kind:'file'|'demo'}
let current = -1;
let shuffle = false, repeat = false;

const $ = id => document.getElementById(id);
const audio = new Audio();
audio.volume = .8;

/* ============ audio graph ============ */
const actx = new (window.AudioContext||window.webkitAudioContext)();
const analyser = actx.createAnalyser();
analyser.fftSize = 256;
const gain = actx.createGain();
gain.connect(analyser); analyser.connect(actx.destination);

let mediaSrc = null;          // MediaElementSource for <audio>
function connectAudio(){
  if(!mediaSrc){ mediaSrc = actx.createMediaElementSource(audio); }
  try{ mediaSrc.disconnect(); }catch(e){}
  mediaSrc.connect(gain);
}

/* ============ demo track (procedural, offline rendered) ============ */
async function buildDemoTrack(){
  const sr=44100, len=12, oc=new OfflineAudioContext(2,sr*len,sr);
  const master=oc.createGain(); master.gain.value=.8; master.connect(oc.destination);
  // reverb-ish delay
  const dly=oc.createDelay(1); dly.delayTime.value=.375;
  const fb=oc.createGain(); fb.gain.value=.35;
  const wet=oc.createGain(); wet.gain.value=.35;
  dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(master);

  const chordProg=[[220,277.2,329.6],[174.6,220,261.6],[196,246.9,293.7],[164.8,207.7,246.9]];
  // pad
  chordProg.forEach((ch,ci)=>{
    ch.forEach(f=>{
      const o=oc.createOscillator(); o.type='sawtooth'; o.frequency.value=f/2;
      const g=oc.createGain(); const t=ci*3;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.05,t+.4); g.gain.linearRampToValueAtTime(0,t+3);
      const lp=oc.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1200;
      o.connect(g); g.connect(lp); lp.connect(master); lp.connect(dly);
      o.start(t); o.stop(t+3.1);
    });
  });
  // arp
  chordProg.forEach((ch,ci)=>{
    const scale=[1,1.25,1.5,2,2.5,3,4];
    for(let i=0;i<12;i++){
      const f=ch[i%3]*scale[(i*2)%7];
      const t=ci*3+i*.25;
      const o=oc.createOscillator(); o.type='triangle'; o.frequency.value=f*2;
      const g=oc.createGain(); g.gain.setValueAtTime(.09,t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
      o.connect(g); g.connect(master); g.connect(dly); o.start(t); o.stop(t+.25);
    }
  });
  // kick + hat
  for(let i=0;i<len*2;i++){
    const t=i*.5;
    if(i%2===0){ // kick
      const o=oc.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+.12);
      const g=oc.createGain(); g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.3);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+.32);
    }else{ // hat
      const b=oc.createBuffer(1,sr*.05,sr); const d=b.getChannelData(0);
      for(let j=0;j<d.length;j++) d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2);
      const s=oc.createBufferSource(); s.buffer=b;
      const hp=oc.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
      const g=oc.createGain(); g.gain.value=.12;
      s.connect(hp); hp.connect(g); g.connect(master); s.start(t);
    }
  }
  const buf=await oc.startRendering();
  return {name:'Midnight Circuit', artist:'NEONWAVE Demo', buffer:buf, duration:len, kind:'demo'};
}

/* ============ playlist ============ */
function fmt(s){ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function renderList(){
  const list=$('plist');
  if(!tracks.length){
    list.className='plist empty';
    list.innerHTML='プレイリストは空です。<br>「＋ 曲を追加」かドラッグ&ドロップで追加できます';
    return;
  }
  list.className='plist';
  list.innerHTML='';
  tracks.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='track'+(i===current?' active':'');
    el.innerHTML=`<span class="n">${i===current?'♪':i+1}</span><span class="name">${t.name}</span><span class="dur">${t.duration?fmt(t.duration):''}</span><span class="x" title="削除">✕</span>`;
    el.onclick=e=>{
      if(e.target.classList.contains('x')){
        const url=t.url; tracks.splice(i,1);
        if(i===current){ stop(); current=-1; }
        else if(i<current) current--;
        if(url) URL.revokeObjectURL(url);
        renderList(); return;
      }
      playIndex(i);
    };
    list.appendChild(el);
  });
}

function addFiles(files){
  [...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(f.name))
  .forEach(f=>{
    tracks.push({name:f.name.replace(/\.[^.]+$/,''), artist:'ローカルファイル', url:URL.createObjectURL(f), kind:'file'});
  });
  renderList();
  if(current<0 && tracks.length) playIndex(0);
}

async function loadDemo(){
  const t=await buildDemoTrack();
  tracks.push(t); current=0;
  $('title').textContent=t.name; $('artist').textContent=t.artist;
  $('dur').textContent=fmt(t.duration);
  renderList();
}

/* 最初のユーザー操作で AudioContext を解禁 */
function unlock(){ actx.resume(); document.removeEventListener('pointerdown',unlock); }
document.addEventListener('pointerdown',unlock);

/* ============ playback ============ */
let bufSrc=null, startedAt=0, pausedAt=0, playing=false, curBuf=null;

function stopSources(){
  audio.pause();
  if(bufSrc){ try{bufSrc.stop()}catch(e){} bufSrc=null; }
}

function playIndex(i){
  if(i<0||i>=tracks.length) return;
  stopSources(); current=i; pausedAt=0;
  const t=tracks[i];
  $('title').textContent=t.name;
  $('artist').textContent=t.artist;
  renderList();
  if(t.kind==='file'){
    audio.src=t.url; connectAudio(); audio.play().then(()=>setPlaying(true));
    $('dur').textContent=fmt(t.duration);
  }else{
    playBuffer(t,0);
  }
}

function playBuffer(t,offset){
  curBuf=t.buffer;
  bufSrc=actx.createBufferSource();
  bufSrc.buffer=curBuf; bufSrc.loop=true;
  bufSrc.connect(gain);
  bufSrc.start(0,offset||0);
  startedAt=actx.currentTime-(offset||0);
  playing=true; setPlaying(true);
  $('dur').textContent=fmt(t.duration);
}

function togglePlay(){
  if(current<0){ if(tracks.length) playIndex(0); return; }
  const t=tracks[current];
  if(t.kind==='file'){
    if(audio.paused){ actx.resume(); audio.play().then(()=>setPlaying(true)); } else { audio.pause(); setPlaying(false); }
  }else{
    if(playing){ pausedAt=actx.currentTime-startedAt; stopSources(); setPlaying(false); }
    else{ actx.resume(); playBuffer(t, pausedAt % t.duration); }
  }
}

function setPlaying(p){
  playing=p;
  $('play').textContent=p?'⏸':'▶';
  $('disc').classList.toggle('playing',p);
  $('eq').classList.toggle('playing',p);
}

function nextTrack(auto){
  if(!tracks.length) return;
  let n;
  if(shuffle) n=Math.floor(Math.random()*tracks.length);
  else{ n=current+1; if(n>=tracks.length){ if(repeat||!auto) n=0; else { setPlaying(false); return; } } }
  playIndex(n);
}
function prevTrack(){
  if(!tracks.length) return;
  playIndex((current-1+tracks.length)%tracks.length);
}

/* progress for both sources */
function curTime(){
  const t=tracks[current]; if(!t) return 0;
  if(t.kind==='file') return audio.currentTime;
  return playing ? (actx.currentTime-startedAt)%t.duration : pausedAt;
}

/* ============ UI events ============ */
$('play').onclick=togglePlay;
$('next').onclick=()=>nextTrack(false);
$('prev').onclick=prevTrack;
$('shuffle').onclick=e=>{ shuffle=!shuffle; e.currentTarget.classList.toggle('toggled',shuffle); };
$('repeat').onclick=e=>{ repeat=!repeat; e.currentTarget.classList.toggle('toggled',repeat); };
$('volume').oninput=e=>{ audio.volume=e.target.value/100; gain.gain.value=e.target.value/100; };
audio.onended=()=>nextTrack(true);
audio.ontimeupdate=()=>{ if(tracks[current]?.kind==='file') updateProgress(); };

$('addBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>addFiles(e.target.files);

const dz=$('drop');
['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault(); if(e.target!==dz) addFiles(e.dataTransfer.files);});

/* seek */
const bar=$('bar');
bar.addEventListener('click',e=>{
  const t=tracks[current]; if(!t||!t.duration) return;
  const r=bar.getBoundingClientRect();
  const p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  if(t.kind==='file') audio.currentTime=p*t.duration;
  else{ pausedAt=p*t.duration; if(playing) playBuffer(t,p*t.duration); }
});

/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  if(e.code==='ArrowRight') nextTrack(false);
  if(e.code==='ArrowLeft') prevTrack();
});

function updateProgress(){
  const t=tracks[current]; if(!t||!t.duration) return;
  const p=curTime()/t.duration*100;
  $('fill').style.width=p+'%'; $('knob').style.left=p+'%';
  $('cur').textContent=fmt(curTime());
}

/* ============ visualizer ============ */
const cv=$('viz'), ctx=cv.getContext('2d');
const freqData=new Uint8Array(analyser.frequencyBinCount);
function fit(){ cv.width=cv.clientWidth*devicePixelRatio; cv.height=74*devicePixelRatio; }
new ResizeObserver(fit).observe(cv); fit();

const hue=(x)=>`hsl(${(262+x*90)%360} 90% ${55+x*8}%)`;
function draw(){
  requestAnimationFrame(draw);
  analyser.getByteFrequencyData(freqData);
  const w=cv.width,h=cv.height,n=48,step=Math.floor(freqData.length/n);
  ctx.clearRect(0,0,w,h);
  for(let i=0;i<n;i++){
    let v=0; for(let j=0;j<step;j++) v=Math.max(v,freqData[i*step+j]);
    const bh=(v/255)*h;
    const bw=w/n;
    const g=ctx.createLinearGradient(0,h,0,h-bh);
    g.addColorStop(0,hue(i/n)); g.addColorStop(1,hue(i/n+0.5));
    ctx.fillStyle=g;
    ctx.shadowColor=hue(i/n); ctx.shadowBlur=12*devicePixelRatio;
    const x=i*bw+bw*.15, bwid=bw*.7;
    ctx.beginPath();
    ctx.roundRect(x,h-bh,bwid,Math.max(bh,2*devicePixelRatio),3*devicePixelRatio);
    ctx.fill();
  }
  ctx.shadowBlur=0;
}
draw();

/* ============ boot ============ */
gain.gain.value=.8;
loadDemo();
</script>
</body>
</html>
